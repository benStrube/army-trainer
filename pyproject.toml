[project]
name = "army-trainer"
version = "0.1.0"
description = "Turn public (Distribution A) Army regulations into visual PowerPoint training decks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pymupdf4llm>=1.28.2",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
army-trainer = "army_trainer.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/army_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
